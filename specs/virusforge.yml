name: VirusForge
title: VirusForge Pipeline DAG
filename: "virusforge · pipeline.dag"
repo: github.com/aliarslan47/VirusForge
favicon: "🦠"
viewbox: [1000, 960]

subtitle_tr: >-
  Gerçek run() veri bağımlılık grafiği. Ortak trunk V00→V04; V04 (geNomad) molekül kararıdır — DNA/faj ve
  RNA virüs dalları ayrılır ve V12 raporunda birleşir. V02/V03/V04/V06 tek modüldür, molekül tipine göre
  kendi içinde dallanır. Okuma tipi (kısa/uzun/hibrit/assembly) buna dik ayrı eksendir.
subtitle_en: >-
  The real run() data-dependency graph. Shared trunk V00→V04; V04 (geNomad) is the molecule decision —
  DNA/phage and RNA virus branches split and rejoin at the V12 report. V02/V03/V04/V06 are single modules
  that fork internally by molecule. Read type (short/long/hybrid/assembly) is a separate, orthogonal axis.
footer_tr: >-
  VirusForge · RNA + DNA viral / faj genom analiz platformu · github.com/aliarslan47/VirusForge. Kenarlar
  gerçek run() veri bağımlılıklarından; molekül ayrımı modül-içi (is_rna/is_phage), yollar V12'de birleşir.
footer_en: >-
  VirusForge · RNA + DNA viral / phage genome analysis platform · github.com/aliarslan47/VirusForge. Edges
  are the real run() data dependencies; the molecule split is in-module (is_rna/is_phage), paths rejoin at V12.
aria_tr: "VirusForge pipeline DAG. Ortak trunk V00-V04, molekül kararı DNA ve RNA dallarına ayrılır, V12'de birleşir."
aria_en: "VirusForge pipeline DAG. Shared trunk V00-V04, molecule decision splits into DNA and RNA branches, rejoin at V12."

