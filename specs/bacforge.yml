name: BacForge
title: BacForge Pipeline DAG
filename: "bacforge · pipeline.dag"
repo: github.com/aliarslan47/BacForge
favicon: "🧫"
viewbox: [1240, 1300]

subtitle_tr: >-
  Gerçek run() bağımlılık grafiği. Platform kararı M00'da verilir (short/long/hybrid/assembly); M01 ve M03
  kendi içinde platforma göre dallanır ve M04'te birleşir. M04 (cilalı genom) merkez hub'dır — M05–M16 ondan
  dallanır. M17 tüm analiz çıktılarını toplar, M18 rapor kapstone'dur. Koşullu modüller (M13–M16) girdi yoksa
  N/A damgalanır.
subtitle_en: >-
  The real run() dependency graph. The platform decision is made in M00 (short/long/hybrid/assembly); M01 and
  M03 branch internally by platform and rejoin at M04. M04 (the polished genome) is the central hub — M05–M16
  fan out from it. M17 aggregates all analysis outputs and M18 is the report capstone. Conditional modules
  (M13–M16) are stamped N/A when inputs are absent.
footer_tr: >-
  BacForge · Bakteri tam-genom (WGS) analiz platformu · github.com/aliarslan47/BacForge. Kenarlar gerçek run()
  bağımlılıklarından; platform ayrımı M01/M03 içinde, M04'te birleşir, M04→M18 platform-agnostik.
footer_en: >-
  BacForge · Bacterial whole-genome (WGS) analysis platform · github.com/aliarslan47/BacForge. Edges are the
  real run() dependencies; the platform split is in M01/M03, rejoins at M04, M04→M18 is platform-agnostic.
aria_tr: "BacForge pipeline DAG. Omurga M00 platform kararı, M04 birleşme ve hub, M05-M16 dallanır, M18 rapor."
aria_en: "BacForge pipeline DAG. Spine M00 platform decision, M04 rejoin and hub, M05-M16 fan out, M18 report."

