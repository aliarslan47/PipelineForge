subtitle_tr: >-
  Metatranskriptom kolu — gerçek run() bağımlılık grafiği. Doğrusal omurga m01→m03→rRNA-temizleme→m04→m05→m06;
  okuma QC (m02) doğrulamadan ayrı bir daldır. İki topluluk aşaması (rRNA-temizleme + taksonomi) trimlemeden
  sonra eklenir: rRNA-temizleme SortMeRNA ile ribozomal okumayı ayıklar, taksonomi (Kraken2+Bracken) rRNA'sız
  okumalarda topluluk kompozisyonunu çıkarır. Niceleme rRNA'sız okumaları GEN KATALOĞUNA (bowtie2) hizalar,
  sayım featureCounts ile CDS/locus_tag üzerinden yapılır; m06 (DESeq2) agnostik hub'dır. Kapılar permissive.
subtitle_en: >-
  The metatranscriptome branch — real run() dependency graph. Linear spine m01→m03→rRNA-depletion→m04→m05→m06;
  read QC (m02) is a branch off validation. Two community stages (rRNA-depletion + taxonomy) are inserted after
  trimming: rRNA-depletion (SortMeRNA) removes ribosomal reads, taxonomy (Kraken2+Bracken) profiles the community
  on the depleted reads. Quantification aligns depleted reads to the GENE CATALOG (bowtie2), counting is
  featureCounts over CDS/locus_tag; m06 (DESeq2) is the agnostic hub. Gates are permissive throughout.
footer_tr: >-
  RNAForge · metatranskriptom kolu · github.com/aliarslan47/RNAForge. Kenarlar gerçek run() bağımlılıklarından
  çıkarıldı: rRNA-temizleme ← m03, taksonomi ← rRNA-temizleme, m04 (gen kataloğu) ← rRNA-temizleme. Referans =
  birleşik topluluk gen kataloğu (gene_catalog.fna/.gff). m19 temizlik koşunun en son adımı.
footer_en: >-
  RNAForge · metatranscriptome branch · github.com/aliarslan47/RNAForge. Edges are the real run() dependencies:
  rRNA-depletion ← m03, taxonomy ← rRNA-depletion, m04 (gene catalog) ← rRNA-depletion. Reference = a combined
  community gene catalog (gene_catalog.fna/.gff). m19 cleanup is the final stage of the run.
aria_tr: "RNAForge metatranskriptom DAG. Omurga m01 m03 rRNA-temizleme m04 m05 m06. Taksonomi ve tanı sağ dallar."
aria_en: "RNAForge metatranscriptome DAG. Spine m01 m03 rRNA-depletion m04 m05 m06. Taxonomy and diagnostics on the right."

