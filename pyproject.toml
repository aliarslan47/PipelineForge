[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelineforge"
version = "0.1.0"
description = "Forge ailesi için standart 'Pipeline DAG' şema üreticisi (spec YAML → self-contained HTML)"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
pipelineforge = "pipelineforge.cli:main"

[tool.setuptools.packages.find]
include = ["pipelineforge*"]
